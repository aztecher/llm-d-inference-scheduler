---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.eppConfig.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-d-inference-scheduler.labels" . | nindent 4 }}   
data:
  epp-config.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      {{- toYaml .Values.eppConfig.plugins | nindent 6 }}
    schedulingProfiles:
      {{- toYaml .Values.eppConfig.schedulingProfiles | nindent 6 }}
