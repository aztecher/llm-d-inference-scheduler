apiVersion: v1
kind: Service
metadata:
  name: {{ include "modelName" . }}-endpoint-picker
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "modelName" . }}-endpoint-picker
    {{- include "llm-d-inference-scheduler.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "modelName" . }}-endpoint-picker
  ports:
  - name: default
    protocol: TCP
    port: 9002
    targetPort: 9002
    appProtocol: http2
  - name: zmq
    protocol: TCP
    port: 5557
    targetPort: 5557
    appProtocol: tcp
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
