apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-sim-metrics
  labels:
    app: vllm-sim-metrics
spec:
  selector:
    matchLabels:
      app: ${POOL_NAME}
  podMetricsEndpoints:
  - port: sidecar-http  # decode / flex-decoder: routing sidecar (port 8000)
    interval: 5s
    path: /metrics
  - port: prefill-http  # PoC prefill: vllm-sim direct (port 8000)
    interval: 5s
    path: /metrics
