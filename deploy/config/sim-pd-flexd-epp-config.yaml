# Sample EPP configuration for tunning with P/D
# Use with small hash block size for simulation purposes
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
# featureGates:
# - prepareDataPlugins
plugins:
- type: disagg-headers-handler
- type: prefix-cache-scorer
  parameters:
    blockSizeTokens: 16
    autoTune: false
    maxPrefixBlocksToMatch: 256
    lruCapacityPerServer: 31250
- type: queue-scorer
- type: prefill-filter
- type: decode-filter
- type: max-score-picker
- type: prefix-based-pd-decider
  parameters:
    nonCachedTokens: 16
# PoC
# Define Saturation Detector which will be used in slo-risk-decider
- type: utilization-detector
  parameters:
    kvCacheThreshold: 0.85
# Define SLORisk decider ( for checking SLO-vioration )
- type: slo-risk-decider
  parameters:
    saturationDetectorPluginName: "utilization-detector"
    saturationThreshold: 0.9
# Define DecodeCapacity decider ( for decide prefill_only or prefil_and_decode )
- type: self-decode-capacity-decider
  parameters:
    kvCacheThreshold: 0.85
    queueDepthThreshold: 50.0
- type: disagg-profile-handler
  parameters:
    profiles:
      decode: decode
      prefill: prefill
      flexDecoder: flex-decoder
    deciders:
      prefill: prefix-based-pd-decider # use existing decider
      sloRisk: slo-risk-decider
      selfDecode: self-decode-capacity-decider
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
